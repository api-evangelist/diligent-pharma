description: >-
  Cross-cutting standards conformance for Diligent Pharma. Diligent Pharma publishes
  no public API, so the API-layer section below records only what could be verified
  from the discovery documents its identity host actually serves. A second section
  records the REGULATORY frameworks the company's clinical-trial vendor qualification
  practice is aligned to — those are the subject matter of the service, not conformance
  claims about a machine interface, and they are kept separate so the two are never
  confused.
api_standards:
  - id: oauth2
    name: OAuth 2.0 (RFC 6749)
    conforms: true
    evidence: >-
      clerk.diligentpharma.com serves /.well-known/oauth-authorization-server (RFC 8414)
      advertising authorization_code and refresh_token grants, a token endpoint, and a
      revocation endpoint (RFC 7009). Applies to Diligent360 application sign-in only.
    scope: application-login
  - id: oidc
    name: OpenID Connect Core 1.0 / Discovery 1.0
    conforms: true
    evidence: >-
      /.well-known/openid-configuration returns a valid discovery document with issuer,
      authorization_endpoint, token_endpoint, userinfo_endpoint, jwks_uri, RS256 id_token
      signing and public subject types.
    scope: application-login
  - id: rfc7636-pkce
    name: PKCE (RFC 7636)
    conforms: true
    evidence: 'code_challenge_methods_supported: ["S256"]'
    scope: application-login
  - id: rfc8414
    name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
    conforms: true
    evidence: /.well-known/oauth-authorization-server returns 200 application/json.
  - id: rfc7517-jwks
    name: JSON Web Key Set (RFC 7517)
    conforms: true
    evidence: /.well-known/jwks.json returns 200 with an RS256 key set.
  - id: rfc9116
    name: security.txt (RFC 9116)
    conforms: false
    evidence: 404 on /.well-known/security.txt for every Diligent Pharma host probed.
  - id: rfc9457
    name: Problem Details for HTTP APIs (RFC 9457)
    conforms: unknown
    evidence: No public API or error reference is published; nothing to assess.
  - id: openapi
    name: OpenAPI
    conforms: false
    evidence: >-
      No OpenAPI/Swagger document found on any host. 360.diligentpharma.com answers
      200 with an HTML SPA shell for /openapi.json, /swagger.json and /api-docs; those
      are not specs. See well-known/diligent-pharma-well-known.yml.
  - id: a2a
    name: A2A Agent Card
    conforms: false
    evidence: >-
      No /.well-known/agent-card.json or /.well-known/agent.json document on any host;
      the 200s on 360.diligentpharma.com are SPA shells.
