aid: diligent-pharma
name: Diligent Pharma
description: 'Diligent Pharma, Inc. is a Princeton, New Jersey clinical-trial quality
  and compliance company, founded in 2015, that operates a centralized vendor qualification
  and oversight platform for pharmaceutical and biotech sponsors and their service
  providers. Its Diligent360 platform unifies the vendor lifecycle — AI-assisted discovery
  across a network of 2,000+ clinical vendors, capability evaluation through standardized
  questionnaires, risk scoring across quality, compliance, cybersecurity and AI risk
  domains, qualification against ICH E6(R3) and GxP expectations, and ongoing oversight
  monitoring. Companion products DiligentRespond (automated vendor questionnaire response)
  and DiligentQualified (qualification package management) sit alongside a GxP audit
  services practice. The company raised an $8.27M Series A led by FCA Venture Partners
  in 2023 and has appeared on the Inc. 5000 list. The platform is delivered as an
  authenticated web application at 360.diligentpharma.com; Diligent Pharma publishes
  no public developer program, API reference, or machine-readable specification.'
